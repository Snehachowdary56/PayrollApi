name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PayrollApi.sln

      - name: Build
        run: dotnet build PayrollApi.sln --no-restore -c Release

      - name: Test
        run: dotnet test PayrollApi.sln --no-build -c Release --verbosity normal

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Angular unit tests (Vitest)
        run: npx ng test --watch=false
      - name: Production build
        run: npx ng build
      - name: Demo build for GitHub Pages
        run: npx ng build --configuration demo --base-href ./ --output-path dist/demo
      - name: Publish demo to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd dist/demo/browser
          cp index.html 404.html
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "Snehachowdary56"
          git config user.email "snehagunturu@gmail.com"
          git add . && git commit -qm "Publish Angular demo"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t payroll-api .
